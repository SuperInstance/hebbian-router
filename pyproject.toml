[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hebbian-router"
version = "0.1.0"
description = "Self-optimizing routes between services and agents with Hebbian plasticity"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Cocapn Fleet", email = "fleet@cocapn.dev"},
]
keywords = [
    "routing",
    "hebbian",
    "neural",
    "optimization",
    "microservices",
    "agents",
    "load-balancing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/hebbian-router"
Repository = "https://github.com/SuperInstance/hebbian-router"
Issues = "https://github.com/SuperInstance/hebbian-router/issues"

[tool.hatch.build.targets.wheel]
packages = ["hebbian_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "D", "UP"]
ignore = ["D100", "D104"]
